name: Build DarkX Death Race

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "3.5.3"

permissions:
  contents: write

jobs:
  export:
    name: Export (Windows + Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in project.godot export_presets.cfg src/Main.gd branding/dx_logo.png; do
            [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }
          done
          [ -d assets ] || { echo "::error::Folder 'assets/' is missing. Copy the game assets (models, textures, materials, fonts) into assets/ before building. See ASSETS_REQUIRED.md"; exit 1; }

      - name: Install Godot + export templates
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_linux_headless.64.zip
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux_headless.64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux_headless.64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/templates
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates ~/.local/share/godot/templates/${GODOT_VERSION}.stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Setup Android SDK + debug keystore
        run: |
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;30.0.3" "platforms;android-29" > /dev/null
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-3.tres <<EOF
          [gd_resource type="EditorSettings" format=2]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF

      - name: Import resources
        run: godot --editor --quit || true

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --export "Windows Desktop" build/windows/DarkX-Death-Race.exe
          test -f build/windows/DarkX-Death-Race.exe

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --export "Linux/X11" build/linux/DarkX-Death-Race.x86_64
          test -f build/linux/DarkX-Death-Race.x86_64

      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --export-debug "Android" build/android/DarkX-Death-Race.apk
          test -f build/android/DarkX-Death-Race.apk

      - name: Package
        run: |
          cd build
          cp ../LICENCE windows/LICENCE.txt
          cp ../LICENCE linux/LICENCE.txt
          chmod +x linux/DarkX-Death-Race.x86_64
          zip -r -9 DarkX-Death-Race-Windows.zip windows
          tar -czf DarkX-Death-Race-Linux.tar.gz linux

      - uses: actions/upload-artifact@v4
        with:
          name: DarkX-Death-Race-Android
          path: build/android/DarkX-Death-Race.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: DarkX-Death-Race-Windows
          path: build/DarkX-Death-Race-Windows.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: DarkX-Death-Race-Linux
          path: build/DarkX-Death-Race-Linux.tar.gz
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/android/DarkX-Death-Race.apk
            build/DarkX-Death-Race-Windows.zip
            build/DarkX-Death-Race-Linux.tar.gz
